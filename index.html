<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages can't set HTTP headers, so the CSP lives here.
       No inline scripts/styles, no third-party code; network only to Supabase. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <title>Room Booking</title>
  <link rel="stylesheet" href="style.css?v=202610212208">
</head>
<body>
  <header>
    <h1>Room Booking</h1>
    <div id="who" hidden>
      <a id="admin-link" href="admin.html" hidden>Admin panel</a>
      <span id="who-email"></span>
      <button id="sign-out" type="button" class="link">Sign out</button>
    </div>
  </header>

  <main>
    <p id="msg" role="status" hidden></p>

    <!-- Accounts are created by an admin in the Supabase dashboard; no public sign-up. -->
    <section id="auth" hidden>
      <h2>Sign in</h2>
      <p class="auth-sub">Use the email and password your admin gave you.</p>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" maxlength="72" required>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="app" hidden>
      <div class="schedule-wrap">
        <aside class="side">
          <input id="day" type="hidden">
          <div id="calendar" class="cal card"></div>

          <div class="card">
            <h2 class="first">Book a room</h2>
            <form id="book-form" novalidate>
              <label for="room">Room</label>
              <select id="room" required></select>

              <label>Time (drag the handles)</label>
              <div id="slider" class="rs"></div>

              <div class="pair">
                <div>
                  <label for="start">Start</label>
                  <select id="start" required></select>
                </div>
                <div>
                  <label for="duration">Duration</label>
                  <select id="duration" required></select>
                </div>
              </div>

              <label for="title">Meeting title</label>
              <input id="title" maxlength="100" required>

              <button type="submit">Book</button>
            </form>
          </div>
        </aside>

        <div>
          <h2 id="day-label" class="first">Schedule</h2>
          <div class="legend">
            <span><i class="free"></i>Free (drag to pick a time)</span>
            <span><i class="booked"></i>Booked</span>
            <span><i class="yours"></i>Yours (click to cancel)</span>
          </div>
          <div id="schedule"></div>

          <h2>My upcoming bookings</h2>
          <ul id="mine" class="list card"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js?v=202610212208"></script>
  <script src="common.js?v=202610212208"></script>
  <script src="app.js?v=202610212208"></script>
</body>
</html>
